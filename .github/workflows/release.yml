name: release

# Push-to-main auto-release flow:
#   1. Push any commit to `main`.
#   2. Tests run (non-PTY subset — wizard.test.mjs needs @lydell/node-pty
#      devDep which isn't portable in all CI images).
#   3. Bump version based on the latest commit's conventional-commit prefix:
#      - `feat…!:` or body contains `BREAKING CHANGE`  → major
#      - `feat(…):` or `feat:`                          → minor
#      - anything else (fix/chore/docs/refactor/…)      → patch
#   4. Commit `chore(release): X.Y.Z`, tag `vX.Y.Z`, push back to main.
#   5. Publish to npm using NPM_TOKEN.
#   6. Create a GitHub Release with auto-generated notes.
#
# Loop prevention: the auto-release commit itself starts with
# `chore(release):` — the job's `if:` filter skips on that prefix so the
# workflow doesn't trigger on its own push. Default `GITHUB_TOKEN` also
# prevents recursive workflow dispatch, so this is belt-and-suspenders.
#
# Manual dispatch (`workflow_dispatch`) lets you re-publish the current
# `main` head without a new commit — use `dry_run=true` to sanity-check auth.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print `npm publish --dry-run` without actually publishing'
        required: false
        default: 'false'

# Serialize release runs so two rapid pushes to main can't race on the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Loop prevention: skip when the pushed commit is the bot's own release bump.
    if: |
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write  # push bump commit + tag, create GitHub Release
      id-token: write  # reserved for future `--provenance` upgrade
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so release notes can diff vs prior tag
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests (non-PTY subset)
        run: node --test $(ls test/*.test.mjs | grep -v 'wizard.test.mjs')

      - name: Determine bump type from commit subject
        id: bump
        if: github.event_name == 'push'
        run: |
          # Prior regex matched the literal phrase "BREAKING CHANGE" anywhere in
          # the body — including when I documented the rule in a commit message,
          # which auto-bumped to 2.0.0. Conventional-commit spec requires the
          # marker to be at the **start of a line**, so use `grep -E '^…:'` on the
          # body (processed line-by-line) plus a separate subject-only check for
          # the `type(scope)!:` form.
          SUBJECT="$(git log -1 --pretty=%s)"
          BODY="$(git log -1 --pretty=%b)"
          if echo "$BODY" | grep -Eq '^BREAKING[ -]?CHANGE:' || echo "$SUBJECT" | grep -Eq '^[a-z]+(\([^)]+\))?!:'; then
            BUMP=major
          elif echo "$SUBJECT" | grep -Eq '^feat(\([^)]+\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP from subject '$SUBJECT'"

      - name: Bump, commit, tag, push
        id: version
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW="$(npm version ${{ steps.bump.outputs.type }} --no-git-tag-version)"
          # `npm version` prefixes with `v` (e.g. `v1.3.3`). Strip for the commit body.
          VERSION="${NEW#v}"
          git add package.json
          git commit -m "chore(release): ${VERSION}"
          git tag -a "$NEW" -m "release ${NEW}"
          git push origin main --follow-tags
          echo "tag=$NEW"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish --access public --dry-run "--//registry.npmjs.org/:_authToken=$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        run: npm publish --access public "--//registry.npmjs.org/:_authToken=$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
