name: release

# Tag-triggered publish. Flow:
#   1. bump version in package.json + add CHANGELOG entry
#   2. commit: `chore(release): X.Y.Z`
#   3. tag:   `git tag -a vX.Y.Z -m "…" && git push --follow-tags`
#   4. CI tests → npm publish → GitHub release (auto-generated notes)
#
# Manual dispatch (`workflow_dispatch`) lets you re-run a publish if the
# tag push failed to trigger for any reason — pick the ref in the UI.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print `npm publish --dry-run` without actually publishing'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating the GitHub Release
      id-token: write  # reserved for future `--provenance` upgrade
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so release notes can diff vs prior tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # `registry-url` is intentionally NOT set here: setup-node would
          # write a placeholder `.npmrc` with `${NODE_AUTH_TOKEN}` that our
          # granular access token doesn't authenticate against (1.3.1 CI run
          # 404'd on PUT). We write `.npmrc` directly below — the exact
          # format that works for `npm publish` locally.

      - name: Configure npm auth (env + npm config set)
        # Belt-and-suspenders: write ~/.npmrc, a project-local .npmrc, AND
        # use `npm config set` so whichever resolution order npm picks, auth
        # is there. Token is passed via env var — never appears in argv/logs,
        # but the `.npmrc` file itself has to contain the literal token value
        # (not a `${}` placeholder) because npm doesn't interpolate env vars.
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          npm config set "//registry.npmjs.org/:_authToken=$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm install
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Debug auth (mask-safe)
        run: |
          echo "node:  $(node --version)"
          echo "npm:   $(npm --version)"
          echo "registry: $(npm config get registry)"
          echo "userconfig:  $(npm config get userconfig)"
          echo "globalconfig: $(npm config get globalconfig)"
          echo "has _authToken in user:  $(grep -c '_authToken' ~/.npmrc || true)"
          echo "has _authToken in proj:  $(grep -c '_authToken' ./.npmrc || true)"
          echo "whoami result: $(npm whoami --registry=https://registry.npmjs.org/ 2>&1 || true)"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run tests (non-PTY subset)
        # test/wizard.test.mjs requires @lydell/node-pty which is a devDep;
        # if its install fails on the CI runner we don't want the release
        # to block. The render/config/pace tests are what actually guard
        # user-visible behavior.
        run: |
          node --test $(ls test/*.test.mjs | grep -v 'wizard.test.mjs')

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "tag/pkg match: $TAG"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish --access public --dry-run

      - name: Publish to npm
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        run: npm publish --access public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
